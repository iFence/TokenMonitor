[package]
name = "tokenmonitor"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["iFence"]
repository = "https://github.com/iFence/TokenMonitor"
resolver = "2"
description = "Token-usage tracking desktop app for AI coding tools (Claude Code, Codex, Gemini CLI, Antigravity, CodeBuddy, WorkBuddy, OpenCode, OpenClaw, Qoder, Pi)"

[lib]
name = "tokenmonitor"
path = "src/lib.rs"

[[bin]]
# NOTE: must not be named "tokenmonitor.exe" — the Intel GPU driver applies a
# per-application profile to exactly that name which makes D3D11CreateDevice
# allocate ~150MB extra host memory (measured: same exe renamed runs at
# ~115MB vs ~265MB floor). See memory notes before renaming back.
name = "tokenmonitor-app"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
# Headless terminal frontend for servers / machines without a display.
# Only builds with `--features tui` (skipped by default so the desktop binary
# never drags ratatui in).
name = "tokenmonitor-tui"
path = "src/bin/tokenmonitor-tui.rs"
required-features = ["tui"]

# GPUI 桌面版与 ratatui TUI 版互斥：
# - `ui`  (default)：桌面版，含 GPUI 渲染栈。
# - `tui`           ：无显示环境下编译 TUI 二进制：`--no-default-features --features tui`。
[features]
default = ["ui"]
ui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-component-assets",
    "dep:http_client",
    "dep:reqwest_client",
    "dep:futures",
]
tui = ["dep:ratatui", "dep:ureq"]

[dependencies]
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
dirs = "6"
notify = "7"
walkdir = "2"
async-channel = "2.5"
# Returns freed memory to the OS on Windows; keeps RSS from parking at the
# allocator's high-water mark after scans / view refreshes.
mimalloc = "0.1"
# Update check: version comparison + async HTTP for the GitHub releases API.
# `semver` is shared by both frontends; the HTTP clients are per-frontend
# (`http_client` for the GPUI app, `ureq` for the TUI).
semver = "1"
futures = { version = "0.3", optional = true }
# DeepSeek harness writes `~/.dsh/sessions/**/*.jsonl.zstd`; streaming decoder.
zstd = "0.13"
# Headless terminal frontend (server / no-display machines).
ratatui = { version = "0.29", optional = true }
# TUI update check: blocking HTTPS GET + download on a background thread.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

# GPUI 栈 —— 不固定 rev 的 git 依赖；版本只通过 Cargo.lock 锁定。
# 切勿加 rev=（git+url 与 git+url?rev= 是两个 source，会解析出两个不兼容的 gpui）。
# 全部 optional：由 `ui` feature 启用，TUI 构建（--no-default-features）不编译。
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"], optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", optional = true }
# 与 gpui 共用同一 git source（Cargo.lock 锁定同一 rev，勿加 rev=）。
http_client = { git = "https://github.com/zed-industries/zed", optional = true }
reqwest_client = { git = "https://github.com/zed-industries/zed", optional = true }

[dev-dependencies]
tempfile = "3"
# Same git source as the main dependency (no `rev =`), enabling the test
# context used by `#[gpui::test]` to simulate mouse input.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
