[package]
name = "rtoken"
version = "0.2.3"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["iFence"]
repository = "https://github.com/iFence/rToken"
resolver = "2"
description = "Token-usage tracking desktop app for AI coding tools (Claude Code, Codex, Gemini CLI, CodeBuddy, OpenCode, OpenClaw, Qoder, Pi)"

[lib]
name = "rtoken"
path = "src/lib.rs"

[[bin]]
# NOTE: must not be named "rtoken.exe" — the Intel GPU driver applies a
# per-application profile to exactly that name which makes D3D11CreateDevice
# allocate ~150MB extra host memory (measured: same exe renamed runs at
# ~115MB vs ~265MB floor). See memory notes before renaming back.
name = "rtoken-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
notify = "7"
walkdir = "2"
async-channel = "2.5"
# Returns freed memory to the OS on Windows; keeps RSS from parking at the
# allocator's high-water mark after scans / view refreshes.
mimalloc = "0.1"
# Update check: version comparison + async HTTP for the GitHub releases API.
semver = "1"
futures = "0.3"
# DeepSeek harness writes `~/.dsh/sessions/**/*.jsonl.zstd`; streaming decoder.
zstd = "0.13"

# GPUI 栈 —— 不固定 rev 的 git 依赖；版本只通过 Cargo.lock 锁定。
# 切勿加 rev=（git+url 与 git+url?rev= 是两个 source，会解析出两个不兼容的 gpui）。
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
# 与 gpui 共用同一 git source（Cargo.lock 锁定同一 rev，勿加 rev=）。
http_client = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
